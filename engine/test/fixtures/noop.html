<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>お問い合わせ</title></head><body>
<h1>お問い合わせ</h1>
<form id="f" action="/noop/post" method="post">
<p>お名前<br><input type="text" name="name" required></p>
<p>メールアドレス<br><input type="email" name="email" required></p>
<p>お問い合わせ内容<br><textarea name="message" required></textarea></p>
<button type="submit">送信する</button>
</form>
<script>document.getElementById('f').addEventListener('submit', e => e.preventDefault());</script>
</body></html>
