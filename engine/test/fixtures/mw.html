<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>お問い合わせ - MW</title></head><body>
<h1>お問い合わせ</h1>
<div class="mw_wp_form mw_wp_form_input"><form method="post" action="">
<dl>
<dt>会社名</dt><dd><input type="text" name="company"></dd>
<dt>お名前<span class="req">必須</span></dt><dd><input type="text" name="name" required></dd>
<dt>メールアドレス<span class="req">必須</span></dt><dd><input type="text" name="email" required></dd>
<dt>お問い合わせ内容<span class="req">必須</span></dt><dd><textarea name="content" required></textarea></dd>
</dl>
<p><label><input type="checkbox" name="agree" value="同意する"> プライバシーポリシーに同意する</label></p>
<input type="submit" name="confirm" value="確認画面へ">
</form></div></body></html>
